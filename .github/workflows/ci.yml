name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: Linux x86-64, windows: x86-64, macos: arm64 (has FMA, needed from M2 on)
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Verify vendored wheels
        run: python tools/vendor.py verify
      - name: Install dev tools and vendored wheels
        run: python tools/dev_env.py --here
      - name: Tests (source tree and built .pyz in a clean venv)
        run: python -m pytest -v
      - name: Build dbc2h.pyz
        run: python tools/build_pyz.py -o dist/dbc2h.pyz --digest-file dist/content-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pyz-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/

  same-content:
    name: Same archive content on every platform
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compare content digests
        shell: bash
        run: |
          cat artifacts/*/content-digest.txt | tr -d '\r' | sort -u > digests.txt
          cat digests.txt
          test "$(wc -l < digests.txt)" -eq 1
